[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "roboidf"
version = "0.1.0"
requires-python = ">=3.12"
description = "M0 synthetic robot identification contracts and offline workflow"
[tool.setuptools]
packages = ["roboidf"]

[project.optional-dependencies]
scientific = ["numpy>=2.0,<3", "scipy>=1.14,<2"]
