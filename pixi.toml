[workspace]
name = "roboidf"
version = "0.1.0"
description = "Agent Harness for robot system identification"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76.0"

[dependencies]
python = "3.12.*"
pandoc = ">=3.13,<4"
tectonic = ">=0.17.0,<0.18"
pymupdf = ">=1.24.1,<2"
scipy = ">=1.18.1,<2"
numpy = ">=2.5.4,<3"

[tasks]
info = "python -c \"from pathlib import Path; print(Path('README.md').read_text())\""

[tasks.paper-build]
cmd = "python scripts/build_paper.py"
[tasks.paper-check]
cmd = "python scripts/check_paper.py"

[tasks.demo]
cmd = "python -m roboidf"
[tasks.test]
cmd = "python -m unittest discover -s tests -v"

[tasks.workflow-demo]
cmd = "python -m roboidf.workflow --output artifacts/workflow"
[tasks.identify-demo]
cmd = "python -m roboidf.backends"
[tasks.validate-demo]
cmd = "python -m roboidf.validation"
[tasks.demo-all]
depends-on = ["demo", "workflow-demo", "identify-demo", "validate-demo"]
